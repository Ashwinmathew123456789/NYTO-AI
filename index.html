<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYTO AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e10;
      --surface: #171719;
      --pill: #1e1f22;
      --line: #2a2b2e;
      --ink: #ececec;
      --ink-soft: #9a9ba0;
      --ink-faint: #6d6e73;
      --accent: #2f6fed;
      --accent-hover: #4c82ef;
      --user-bubble: #22427f;
      --error: #e5a397;
      --error-tint: #2c1c19;
      --code-bg: #0a0a0b;
      --code-fg: #e4e7ec;
      --code-header: #1c1d20;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --pill: #f3f4f6;
        --line: #e6e7eb;
        --ink: #111318;
        --ink-soft: #6b6d74;
        --ink-faint: #9a9ba3;
        --accent: #2f6fed;
        --accent-hover: #1f5adb;
        --user-bubble: #2f6fed;
        --error: #a3402f;
        --error-tint: #fbecea;
        --code-bg: #14161b;
        --code-fg: #e4e7ec;
        --code-header: #1e2027;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
      color: var(--ink);
    }

    .panel {
      width: 100%;
      max-width: 460px;
      height: 780px;
      max-height: 92vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    header {
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    header .name {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--ink-soft);
    }

    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    #chatBox::-webkit-scrollbar { width: 5px; }
    #chatBox::-webkit-scrollbar-track { background: transparent; }
    #chatBox::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

    .msg-row { display: flex; flex-direction: column; }

    .msg-row {
      animation: msg-rise 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes msg-rise {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .typing-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink-faint);
      animation: typing-bounce 1.1s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg-row { animation: none; }
      .typing-dots span { animation: none; opacity: 0.8; }
    }

    .msg-row.from-user { align-items: flex-end; }
    .msg-row.from-bot, .msg-row.is-error { align-items: flex-start; }

    .bubble {
      max-width: 82%;
      font-size: 0.96rem;
      line-height: 1.5;
    }

    .msg-row.from-user .bubble {
      background: var(--user-bubble);
      color: #fff;
      padding: 10px 15px;
      border-radius: 18px 18px 4px 18px;
    }

    .msg-row.from-bot .bubble {
      color: var(--ink);
      padding: 2px 0;
    }

    .msg-row.is-error .bubble {
      background: var(--error-tint);
      color: var(--error);
      padding: 10px 15px;
      border-radius: 18px 18px 18px 4px;
    }

    #loading .bubble { color: var(--ink-faint); }

    .actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
    }

    .actions button {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--ink-faint);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .actions button:hover { background: var(--surface); color: var(--ink-soft); }
    .actions button.active { color: var(--accent); }
    .actions button svg { width: 15px; height: 15px; }

    code.inline-code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85em;
      background: var(--surface);
      border-radius: 3px;
      padding: 1px 5px;
    }

    .code-block {
      margin: 8px 0;
      border-radius: 8px;
      overflow: hidden;
      text-align: left;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--code-header);
      padding: 6px 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.66rem;
      color: var(--ink-faint);
    }

    .copy-btn {
      background: transparent;
      border: 1px solid #3a3b3f;
      color: var(--code-fg);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.64rem;
      padding: 3px 9px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .copy-btn:hover { border-color: var(--accent); background: rgba(47,111,237,0.2); }
    .copy-btn.copied { background: var(--accent); border-color: var(--accent); color: #fff; }

    .code-block pre {
      margin: 0;
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 12px;
      overflow-x: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .input-bar {
      flex-shrink: 0;
      padding: 10px 14px 16px;
    }

    .input-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--pill);
      border-radius: 26px;
      padding: 6px 6px 6px 16px;
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      padding: 8px 0;
    }

    input[type="text"]::placeholder { color: var(--ink-faint); }

    .round-btn {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    .round-btn.ghost {
      background: transparent;
      color: var(--ink-soft);
    }
    .round-btn.ghost:hover { color: var(--ink); }

    .round-btn.ghost.listening {
      color: var(--error);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .round-btn.solid {
      background: var(--accent);
      color: #fff;
    }
    .round-btn.solid:hover { background: var(--accent-hover); }
    .round-btn.solid:active { transform: scale(0.94); }

    .round-btn svg { width: 18px; height: 18px; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229,163,151,0.25); }
      50% { box-shadow: 0 0 0 6px rgba(229,163,151,0.06); }
    }

    .voice-note {
      font-size: 0.68rem;
      color: var(--ink-faint);
      padding: 4px 16px 0;
    }

    @media (max-width: 500px) {
      .panel { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>

  <div class="panel">
    <header>
      <span class="name">NYTO AI</span>
    </header>

    <div id="chatBox">
      <div class="msg-row from-bot">
        <div class="bubble">Hai! 👋<br>How are you doing? What are we working on today?</div>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-pill">
        <input type="text" id="userInput" placeholder="Message NYTO AI…" onkeypress="if(event.key === 'Enter') sendMessage()" oninput="refreshSendButton()">
        <button class="round-btn ghost" id="micBtn" onclick="toggleVoiceInput()" title="Speak your message" aria-label="Voice input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>
        </button>
        <button class="round-btn solid" id="sendBtn" onclick="sendMessage()" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
      <div class="voice-note" id="voiceNote" style="display:none;">Voice input isn't supported in this browser — try Chrome on desktop or Android.</div>
    </div>
  </div>

  <script>
    // --- Voice input (speech-to-text only; nothing is sent until you press Send) ---
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;
    let isListening = false;

    if (!SpeechRecognitionAPI) {
      document.getElementById('micBtn').disabled = true;
      document.getElementById('voiceNote').style.display = 'block';
    } else {
      recognizer = new SpeechRecognitionAPI();
      recognizer.continuous = false;
      recognizer.interimResults = true;
      recognizer.lang = 'en-US';

      recognizer.onresult = (event) => {
        let finalText = '';
        let interimText = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += transcript;
          else interimText += transcript;
        }
        document.getElementById('userInput').value = (finalText || interimText).trim();
        refreshSendButton();
      };

      recognizer.onerror = () => stopListening();
      recognizer.onend = () => stopListening();
    }

    function stopListening() {
      isListening = false;
      document.getElementById('micBtn').classList.remove('listening');
    }

    function toggleVoiceInput() {
      if (!recognizer) return;
      if (isListening) {
        recognizer.stop();
        stopListening();
        return;
      }
      document.getElementById('userInput').value = '';
      isListening = true;
      document.getElementById('micBtn').classList.add('listening');
      recognizer.start();
    }

    function refreshSendButton() {
      const hasText = document.getElementById('userInput').value.trim().length > 0;
      document.getElementById('sendBtn').style.opacity = hasText ? '1' : '0.5';
    }

    let codeBlockCounter = 0;

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatText(rawText) {
      let text = escapeHtml(rawText);

      text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
        codeBlockCounter++;
        const id = `code-block-${codeBlockCounter}`;
        const label = lang ? lang.trim() : 'code';
        return `<div class="code-block">` +
                 `<div class="code-header"><span>${label}</span>` +
                 `<button class="copy-btn" onclick="copyCode('${id}', this)">Copy</button></div>` +
                 `<pre><code id="${id}">${code.trim()}</code></pre>` +
               `</div>`;
      });

      text = text.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\n/g, '<br>');

      return text;
    }

    async function copyCode(id, btn) {
      const codeEl = document.getElementById(id);
      if (!codeEl) return;
      try {
        await navigator.clipboard.writeText(codeEl.textContent);
        const original = btn.textContent;
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
      } catch (err) {
        btn.textContent = 'Failed';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
      }
    }

    async function copyMessage(btn, text) {
      try {
        await navigator.clipboard.writeText(text);
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 1200);
      } catch (err) { /* clipboard unavailable */ }
    }

    function toggleRating(btn, group) {
      const row = btn.closest('.actions');
      row.querySelectorAll(`[data-group="${group}"]`).forEach(b => { if (b !== btn) b.classList.remove('active'); });
      btn.classList.toggle('active');
    }

    function buildActionRow(rawText) {
      const safeText = rawText.replace(/'/g, "\\'").replace(/\n/g, '\\n');
      return `<div class="actions">
        <button title="Copy" onclick="copyMessage(this, '${safeText}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <button title="Good response" data-group="rate" onclick="toggleRating(this, 'rate')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14Z"></path><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
        </button>
        <button title="Bad response" data-group="rate" onclick="toggleRating(this, 'rate')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10Z"></path><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>
        </button>
      </div>`;
    }

    async function sendMessage() {
      const userInput = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const messageText = userInput.value.trim();

      if (!messageText) return;

      chatBox.insertAdjacentHTML('beforeend',
        `<div class="msg-row from-user"><div class="bubble">${escapeHtml(messageText).replace(/\n/g, '<br>')}</div></div>`);
      userInput.value = '';
      refreshSendButton();

      chatBox.insertAdjacentHTML('beforeend',
        `<div class="msg-row from-bot" id="loading"><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // Calls your Cloudflare Worker proxy — no API key lives in this file.
        const PROXY_URL = "https://nytoai.ashwinmathew56.workers.dev";

        const response = await fetch(PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: messageText })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        if (data.text) {
          let botText = data.text;
          botText = botText.replace(/google/gi, "Nyto");
          const formatted = formatText(botText);

          const loadingEl = document.getElementById('loading');
          if (loadingEl) loadingEl.remove();
          chatBox.insertAdjacentHTML('beforeend',
            `<div class="msg-row from-bot"><div class="bubble">${formatted}</div>${buildActionRow(botText)}</div>`);
        } else {
          throw new Error("Invalid response format received from API.");
        }

      } catch (error) {
        const loadingEl = document.getElementById('loading');
        if (loadingEl) loadingEl.remove();
        chatBox.insertAdjacentHTML('beforeend',
          `<div class="msg-row is-error"><div class="bubble">${escapeHtml(error.message)}</div></div>`);
        console.error(error);
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    refreshSendButton();
  </script>

</body>
</html>
